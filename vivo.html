<script>
// Theme switcher
function setTheme(name, el) {
  document.body.setAttribute('data-theme', name);
  try { localStorage.setItem('opc-theme', name); } catch(e) {}
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  if (el) el.classList.add('active');
  else {
    var match = document.querySelector('.theme-dot[data-set="' + name + '"]');
    if (match) match.classList.add('active');
  }
}
try {
  var saved = localStorage.getItem('opc-theme');
  if (saved && saved !== 'indigo') { setTheme(saved); }
} catch(e) {}
</script>

    1: 'smartphone', 2: 'tablet', 3: 'watch', 4: 'headphones'

  // --- Render Chat History ---
  var chatMessages = document.getElementById('chatMessages');
  DB.vivoChatHistory.forEach(function(msg) {
    var isAssistant = msg.role === 'assistant';
    var div = document.createElement('div');
    div.className = 'chat-msg ' + (isAssistant ? 'assistant' : 'user');
    div.innerHTML =
      '<div class="chat-msg-avatar ' + (isAssistant ? 'assistant' : 'user') + '">' + (isAssistant ? 'vC' : 'CY') + '</div>' +
      '<div class="chat-msg-bubble">' + msg.content.replace(/\n/g, '<br>') + '</div>';
    chatMessages.appendChild(div);
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;

  // --- Render Quick Actions ---
  var quickActions = document.getElementById('quickActions');
  DB.vivoQuickActions.forEach(function(action) {
    var btn = document.createElement('button');
    btn.className = 'chat-quick-btn';
    btn.textContent = action;
    btn.onclick = function() {
      var input = document.getElementById('chatInput');
      input.value = action;
      input.focus();
    };
    quickActions.appendChild(btn);
  });

  // --- Render vivo Apps ---
  var appsGrid = document.getElementById('vivoAppsGrid');
  DB.vivoApps.forEach(function(app) {
    var card = document.createElement('div');
    card.className = 'vivo-app-card';
    var statText = '';
    if (app.connected) {
      if (app.docs !== undefined) statText = app.docs + ' 个文档';
      else if (app.events !== undefined) statText = app.events + ' 个日程';
      else if (app.unread !== undefined) statText = app.unread + ' 封未读';
      else if (app.used !== undefined) statText = '已用 ' + app.used;
      else if (app.upcoming !== undefined) statText = app.upcoming + ' 个待开';
      else if (app.notes !== undefined) statText = app.notes + ' 条笔记';
      else if (app.contacts !== undefined) statText = app.contacts + ' 个联系人';
    } else {
      statText = '未连接';
    }
    card.innerHTML =
      '<div class="vivo-app-icon" style="background:' + app.color + '20; color:' + app.color + ';">' + (iconMap[app.icon] || '') + '</div>' +

      '<div class="device-info">' +
        '<div class="device-name">' + dev.name + '</div>' +
        '<div class="device-detail">' + dev.detail + '</div>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<div class="flex items-center gap-4" style="justify-content:flex-end;">' +
          '<span class="status-dot online"></span>' +
          '<span class="text-sm text-success">在线</span>' +
        '</div>' +
        '<div class="text-sm text-muted" style="margin-top:2px;">同步: ' + dev.lastSync + '</div>' +
      '</div>';
    deviceList.appendChild(div);
  });

  // --- Render Capabilities ---
  var capList = document.getElementById('capabilityList');
  DB.vivoCapabilities.forEach(function(cap) {
    var div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:12px;';
    div.innerHTML =
      '<div style="width:36px;height:36px;border-radius:8px;background:rgba(65,95,255,0.15);color:#415FFF;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + (iconMap[cap.icon] || '') + '</div>' +
      '<div>' +
        '<div class="text-md font-semibold">' + cap.name + '</div>' +
        '<div class="text-sm text-sub">' + cap.desc + '</div>' +
      '</div>';
    capList.appendChild(div);
  });

  // --- Chat Send Function ---
  window.sendMessage = function() {
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if (!text) return;

    // Add user message
    var userDiv = document.createElement('div');
    userDiv.className = 'chat-msg user';
    userDiv.innerHTML =
      '<div class="chat-msg-avatar user">CY</div>' +
      '<div class="chat-msg-bubble">' + text.replace(/\n/g, '<br>') + '</div>';
    chatMessages.appendChild(userDiv);
    input.value = '';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Show typing indicator
    var typingDiv = document.createElement('div');
    typingDiv.className = 'chat-msg assistant';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML =
      '<div class="chat-msg-avatar assistant">vC</div>' +
      '<div class="chat-msg-bubble">' +
        '<div class="typing-indicator">' +
          '<div class="typing-dot"></div>' +
          '<div class="typing-dot"></div>' +
          '<div class="typing-dot"></div>' +
        '</div>' +
      '</div>';
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Simulate response after 1.5s
    setTimeout(function() {
      var indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();

      var responses = [
        '好的，我正在为你处理。已通过 vivo 文档创建相关内容，你可以随时查看和编辑。',
        '已收到你的请求！我已经在 vivo 生态中同步了相关数据，所有设备将自动更新。',
        '明白了。我已为你安排好相关操作，日程提醒已通过 vivo 日历设置，到时会自动通知你。',
        '没问题！我已通过 vivo 云盘同步了所需文件，你可以在任何设备上访问。需要我帮你做其他事吗？',
        '已完成！相关操作已通过 vivo 办公套件执行，结果已同步到你的所有设备。'
      ];
      var resp = responses[Math.floor(Math.random() * responses.length)];

      var botDiv = document.createElement('div');
      botDiv.className = 'chat-msg assistant';
      botDiv.innerHTML =
        '<div class="chat-msg-avatar assistant">vC</div>' +
        '<div class="chat-msg-bubble">' + resp + '</div>';
      chatMessages.appendChild(botDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }, 1500);
  };

  // Enter to send
  document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
})();
</script>
</body>
</html>
