<script>
// Theme switcher
function setTheme(name, el) {
  document.body.setAttribute('data-theme', name);
  try { localStorage.setItem('opc-theme', name); } catch(e) {}
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  if (el) el.classList.add('active');
  else {
    var match = document.querySelector('.theme-dot[data-set="' + name + '"]');
    if (match) match.classList.add('active');
  }
}
// Restore saved theme
try {
  var saved = localStorage.getItem('opc-theme');
  if (saved && saved !== 'indigo') {
    setTheme(saved);
  }
} catch(e) {}
</script>
<script>
// ===== Message List Rendering =====
const AI_REPLIES = {
  1: ['收到，我看下后给你反馈', '好的，第3章流程图我会重点确认，预计1小时内回复', '感谢修改，稍后确认后回复'],
  2: ['好的，已收到报销审批通知', '感谢提醒，我会留意到账进度'],
  3: ['收到，我会在第5页补充竞品对比数据', '好的，预计今天下午17:00前更新一版给您'],
  4: ['好的，我把链接再发一下到群里', '稍等，马上把上次分享的AI工具链接同步给你'],
  5: ['已收到 PR 合并通知，感谢', 'OK，稍后会同步本地分支'],
  6: ['收到提醒，14:00 准时参会', '好的，已加入日程'],
  7: ['已收到商单邀请，稍后回复对接详情', '感谢推荐，今晚前回复合作意向'],
  8: ['收到，我看下封面初稿后回复', '好的，稍后给到具体调整意见'],
};

const listEl = document.getElementById('msg-list');
const detailEl = document.getElementById('msg-detail');
let activeId = DB.messages[0].id;

function platformTagColor(p) {
  if (p === '飞书' || p === '钉钉') return 'tag-info';
  if (p === '企业微信' || p === '微信') return 'tag-success';
  if (p === 'GitHub') return 'tag-neutral';
  if (p === '邮件') return 'tag-danger';
  return 'tag-primary';
}

function renderList(filter) {
  const items = (DB.messages || []).filter(m => {
    if (!filter || filter === 'all') return true;
    if (filter === 'unread') return !m.read;
    if (filter === 'important') return m.priority === 'high';
    if (filter === 'mention') return /@陈逸飞|@你/.test(m.content);
    if (filter === 'pending') return !m.read && m.priority === 'high';
    return m.platform === filter;
  });
  listEl.innerHTML = items.length ? items.map(m => {
    const highBorder = m.priority === 'high' ? `border-left: 3px solid var(--color-danger);` : `border-left: 3px solid transparent;`;
    const unreadBg = !m.read ? `background: rgba(99, 102, 241, 0.06);` : '';
    const dot = !m.read ? `<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary); flex-shrink: 0;"></span>` : `<span style="width: 8px; height: 8px;"></span>`;
    return `
      <div class="msg-row" data-id="${m.id}" style="padding: 12px 16px; ${highBorder} ${unreadBg} display: flex; align-items: flex-start; gap: 12px; cursor: pointer; border-bottom: 1px solid var(--color-border-light); transition: background var(--transition); ${m.id === activeId ? 'background: rgba(99, 102, 241, 0.12);' : ''}">
        <div class="platform-icon" style="background: ${m.platformColor}; width: 32px; height: 32px; font-size: 11px;">${m.platformIcon}</div>
        <div class="avatar" style="background: linear-gradient(135deg, ${m.platformColor}, #06B6D4);">${m.senderAvatar}</div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px;">
            <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
              <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ${!m.read ? 'color: var(--color-text);' : 'color: var(--color-text-sub);'}">${m.sender}</span>
              <span class="tag ${platformTagColor(m.platform)}" style="flex-shrink: 0;">${m.platform}</span>
            </div>
            <span style="font-size: 11px; color: var(--color-text-muted); flex-shrink: 0;">${m.time}</span>
          </div>
          <div style="font-size: 12px; color: var(--color-text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${m.content}</div>
        </div>
        ${dot}
      </div>
    `;
  }).join('') : `<div class="empty-state"><div class="empty-state-text">暂无符合条件的消息</div></div>`;

  // hover
  listEl.querySelectorAll('.msg-row').forEach(r => {
    r.addEventListener('mouseenter', () => { if (r.dataset.id != activeId) r.style.background = 'var(--color-surface-hover)'; });
    r.addEventListener('mouseleave', () => { if (r.dataset.id != activeId) r.style.background = ''; });
    r.addEventListener('click', () => {
      activeId = Number(r.dataset.id);
      renderList(currentFilter);
      renderDetail();
    });
  });
}

function renderDetail() {
  const m = DB.messages.find(x => x.id === activeId) || DB.messages[0];
  const replies = AI_REPLIES[m.id] || ['收到，稍后回复您', '好的，我会尽快处理'];
  detailEl.innerHTML = `
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="platform-icon" style="background: ${m.platformColor}; width: 36px; height: 36px; font-size: 13px;">${m.platformIcon}</div>
      <div>
        <div style="font-size: 14px; font-weight: 600;">${m.platform}</div>
        <div style="font-size: 11px; color: var(--color-text-muted);">${m.time} · ${m.priority === 'high' ? '高优先级' : m.priority === 'low' ? '低优先级' : '普通'}</div>
      </div>
      <span class="tag ${platformTagColor(m.platform)}" style="margin-left: auto;">来源</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--color-surface-hover); border-radius: 8px;">
      <div class="avatar avatar-lg" style="background: linear-gradient(135deg, ${m.platformColor}, #06B6D4);">${m.senderAvatar}</div>
      <div style="min-width: 0;">
        <div style="font-size: 14px; font-weight: 600;">${m.sender}</div>
        <div style="font-size: 11px; color: var(--color-text-muted);">通过 ${m.platform} · ${m.type === 'group' ? '群聊' : m.type === 'notification' ? '系统通知' : m.type === 'email' ? '邮件' : m.type === 'file' ? '文件消息' : '文本消息'}</div>
      </div>
    </div>
    <div style="font-size: 13px; line-height: 1.7; color: var(--color-text); padding: 12px; background: var(--color-bg-alt); border-radius: 8px; border: 1px solid var(--color-border-light);">
      ${m.content}
    </div>
    <div class="glass-card" style="padding: 14px;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px; color: var(--color-accent);"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/></svg>
        <span style="font-size: 13px; font-weight: 600; color: var(--color-accent);">AI 建议回复</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        ${replies.map(r => `<button class="ai-reply-chip" data-text="${r.replace(/"/g, '&quot;')}" style="text-align: left; padding: 8px 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 6px; font-size: 12px; color: var(--color-text); transition: all var(--transition); line-height: 1.5;">${r}</button>`).join('')}
      </div>
    </div>
    <div style="flex: 1;"></div>
    <div style="display: flex; gap: 6px; padding-top: 4px;">
      <button class="btn btn-ghost btn-sm" style="flex: 1; justify-content: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><path d="M14.5 15.5 9 10"/><path d="m13 6 7.5 7.5L13 21"/><path d="M4 6h7"/></svg>
        转发
      </button>
      <button class="btn btn-ghost btn-sm" style="flex: 1; justify-content: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.44 12 17.77 5.82 21.44 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        标记重要
      </button>
      <button class="btn btn-ghost btn-sm" style="flex: 1; justify-content: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="m9 13 3 3 3-3"/></svg>
        归档
      </button>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-end;">
      <textarea id="reply-input" placeholder="输入回复内容，或点击上方 AI 建议…" style="flex: 1; min-height: 64px; max-height: 120px; padding: 10px 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; color: var(--color-text); font-size: 13px; resize: none; outline: none; font-family: inherit;" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'"></textarea>
      <button id="reply-send" class="btn btn-primary" style="height: 64px; padding: 0 16px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.062 1.062z"/><path d="m21.854 2.146-8.828 8.828"/></svg>
        发送
      </button>
    </div>
  `;
  detailEl.querySelectorAll('.ai-reply-chip').forEach(c => {
    c.addEventListener('mouseenter', () => { c.style.borderColor = 'var(--color-primary)'; c.style.background = 'var(--color-primary-light)'; });
    c.addEventListener('mouseleave', () => { c.style.borderColor = 'var(--color-border)'; c.style.background = 'var(--color-surface)'; });
    c.addEventListener('click', () => {
      const input = document.getElementById('reply-input');
      if (input) input.value = c.dataset.text;
      input && input.focus();
    });
  });
  const sendBtn = document.getElementById('reply-send');
  if (sendBtn) sendBtn.addEventListener('click', () => {
    const input = document.getElementById('reply-input');
    if (input && input.value.trim()) { input.value = ''; alert('回复已发送'); }
  });
}

// Filter interactions
let currentFilter = 'all';
document.querySelectorAll('[data-filter]').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('[data-filter],[data-smart]').forEach(x => {
      x.classList.remove('active');
      x.style.background = ''; x.style.color = '';
    });
    el.classList.add('active');
    el.style.background = 'var(--color-primary-light)'; el.style.color = 'var(--color-primary)';
    currentFilter = el.dataset.filter || el.dataset.smart;
    renderList(currentFilter);
  });
});
document.querySelectorAll('[data-smart]').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('[data-filter],[data-smart]').forEach(x => {
      x.classList.remove('active'); x.style.background = ''; x.style.color = '';
    });
    el.classList.add('active');
    el.style.background = 'var(--color-primary-light)'; el.style.color = 'var(--color-primary)';
    currentFilter = el.dataset.smart;
    renderList(currentFilter);
  });
});

renderList('all');
renderDetail();
</script>
</body>
</html>
