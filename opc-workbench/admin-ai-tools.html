<script>
function setTheme(name, el) {
  document.body.setAttribute('data-theme', name);
  try { localStorage.setItem('opc-theme', name); } catch(e) {}
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  if (el) el.classList.add('active');
}
try { var saved = localStorage.getItem('opc-theme'); if (saved && saved !== 'indigo') { setTheme(saved); } } catch(e) {}

// ===== Page-specific JS =====
(function() {
  // Merge aiToolConfigs with aiTools for color/icon
  const toolMeta = {};
  DB.aiTools.forEach(t => { toolMeta[t.name] = { icon: t.icon, color: t.color }; });

  const categoryTagClass = {
    'AI对话': 'tag-primary',
    'AI编程': 'tag-info',
    'AI助手': 'tag-success',
    'AI绘画': 'tag-warning',
    'AI视频': 'tag-danger',
    'AI音频': 'tag-neutral',
    'AI短剧': 'tag-primary',
    'AI设计': 'tag-info'
  };

  const tbody = document.querySelector('#aiToolTable tbody');
  DB.aiToolConfigs.forEach(t => {
    const meta = toolMeta[t.name] || { icon: '?', color: '#64748B' };
    const notConfigured = t.apiKey === '未配置';
    const tr = document.createElement('tr');
    if (notConfigured) {
      tr.style.opacity = '0.7';
    }
    tr.innerHTML = `
      <td>
        <div class="flex items-center gap-8">
          <span class="platform-icon" style="background:${meta.color};width:28px;height:28px;border-radius:6px;font-size:11px;">${meta.icon}</span>
          <span class="font-medium">${t.name}</span>
        </div>
      </td>
      <td><span class="tag ${categoryTagClass[t.category] || 'tag-neutral'}">${t.category}</span></td>
      <td style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-sub);">${t.provider}</td>
      <td>
        ${notConfigured ? '<span class="tag tag-danger">未配置</span>' : `
        <div class="api-key-field">
          <input class="form-input" type="password" value="${t.apiKey}" readonly style="height:28px;">
          <button class="api-key-toggle-btn" onclick="toggleApiKey(this)" style="height:28px;width:28px;padding:0;" title="显示/隐藏密钥">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>`}
      </td>
      <td style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-sub);">${t.model}</td>
      <td>
        <div class="toggle ${t.enabled ? 'on' : ''}" onclick="this.classList.toggle('on'); event.stopPropagation();" title="${t.enabled ? '点击禁用' : '点击启用'}"></div>
      </td>
      <td>${t.calls.toLocaleString()}</td>
      <td class="font-semibold" style="font-family:var(--font-mono);">${t.cost}</td>
      <td style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-sub);">${t.rateLimit}</td>
      <td style="text-align:right;">
        <div class="flex gap-4" style="justify-content:flex-end;">
          <button class="btn btn-secondary btn-sm" ${notConfigured ? 'style="border-color:var(--color-primary);color:var(--color-primary);"' : ''}>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            配置
          </button>
          <button class="btn btn-ghost btn-sm" title="用量">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
            用量
          </button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // --- Cost Trend Chart ---
  const costData = [
    { month: '8月', value: 180 },
    { month: '9月', value: 195 },
    { month: '10月', value: 210 },
    { month: '11月', value: 225 },
    { month: '12月', value: 240 },
    { month: '1月', value: 247.50, current: true }
  ];
  const maxVal = Math.max(...costData.map(d => d.value));
  const chart = document.getElementById('costChart');
  const labels = document.getElementById('costLabels');
  costData.forEach((d) => {
    const bar = document.createElement('div');
    bar.className = 'chart-bar-item' + (d.current ? ' accent' : '');
    bar.style.height = ((d.value / maxVal) * 100) + '%';
    bar.title = `${d.month} ¥${d.value}`;
    bar.setAttribute('data-tip', `${d.month} ¥${d.value}`);
    bar.classList.add('tooltip');
    chart.appendChild(bar);

    const lbl = document.createElement('div');
    lbl.style.flex = '1';
    lbl.style.textAlign = 'center';
    lbl.style.fontSize = '11px';
    lbl.style.color = d.current ? 'var(--color-accent)' : 'var(--color-text-muted)';
    lbl.style.fontWeight = d.current ? '600' : '400';
    lbl.textContent = d.month;
    labels.appendChild(lbl);
  });
})();

// ===== Toggle API Key visibility =====
function toggleApiKey(btn) {
  const input = btn.parentElement.querySelector('.form-input');
  const svg = btn.querySelector('svg');
  if (input.type === 'password') {
    input.type = 'text';
    svg.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
  } else {
    input.type = 'password';
    svg.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  }
}
</script>
