        </div>

          <div class="stat-card-trend up">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6-6 6 6"/><path d="M12 3v18"/></svg>

          </div>
        </div>
        <div class="card-body">
          <div class="grid grid-2 gap-24">
            <!-- Left: Monthly Bar Chart -->
            <div>
              <div class="flex items-end justify-between mb-16">
                <div>
                  <div class="text-sm text-sub">近6个月收入</div>
                  <div class="text-2xl font-bold" style="font-family:var(--font-display);">¥51,500</div>
                </div>
                <div class="tag tag-success">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6-6 6 6"/><path d="M12 3v18"/></svg>
                  +18.2%
                </div>
              </div>
              <div class="chart-bar" id="revenueChart" style="height:160px;"></div>
              <div class="flex gap-8 mt-8" id="revenueLabels"></div>
            </div>
            <!-- Right: Platform Breakdown -->
            <div>
              <div class="flex items-center justify-between mb-16">
                <div class="text-sm text-sub">平台收入占比</div>
                <div class="text-sm text-muted">合计 ¥51,500</div>
              </div>
              <div class="flex flex-col gap-12" id="platformBreakdown"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script>
function setTheme(name, el) {
  document.body.setAttribute('data-theme', name);
  try { localStorage.setItem('opc-theme', name); } catch(e) {}
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  if (el) el.classList.add('active');
}
try { var saved = localStorage.getItem('opc-theme'); if (saved && saved !== 'indigo') { setTheme(saved); } } catch(e) {}

(function() {
  // --- Platform meta for icon/color ---
  var platformMeta = {
    '巨量星图': { icon: 'XT', color: '#FF6B00' },
    '塔猴': { icon: 'TH', color: '#8B5CF6' },
    '一品威客': { icon: 'YP', color: '#06B6D4' },
    '快手聚星': { icon: 'KS', color: '#FF4906' }
  };

  // --- Status mapping ---
  var statusMap = {
    '进行中': 'tag-warning',
    '待接单': 'tag-info',
    '已完成': 'tag-success',
    '已结算': 'tag-primary'
  };

  // --- Avatar initial ---
  function initial(name) {
    if (!name || name === '待分配') return '?';
    return name.charAt(0);
  }

  // --- Orders Table ---
  var tbody = document.querySelector('#ordersTable tbody');
  DB.adminOrders.forEach(function(o) {
    var pm = platformMeta[o.platform] || { icon: '?', color: '#64748B' };
    var statusTag = statusMap[o.status] || 'tag-neutral';
    var assigned = o.assignedTo;
    var avatarClass = assigned === '待分配' ? 'avatar avatar-sm' : 'avatar avatar-sm';
    var tr = document.createElement('tr');
    tr.innerHTML = ''
      + '<td style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-sub);">' + o.id + '</td>'
      + '<td><div class="flex items-center gap-8"><span class="platform-icon" style="background:' + pm.color + ';">' + pm.icon + '</span><span>' + o.platform + '</span></div></td>'
      + '<td>' + o.client + '</td>'
      + '<td class="text-sub">' + o.type + '</td>'
      + '<td class="font-semibold">¥' + o.budget.toLocaleString() + '</td>'
      + '<td class="text-warning">¥' + o.commission.toLocaleString() + '</td>'
      + '<td class="text-sub">' + o.deadline + '</td>'
      + '<td><span class="tag ' + statusTag + '">' + o.status + '</span></td>'
      + '<td><div class="flex items-center gap-8"><span class="' + avatarClass + '">' + initial(assigned) + '</span><span class="text-sm">' + assigned + '</span></div></td>'
      + '<td><div class="flex gap-4"><button class="btn btn-ghost btn-sm">详情</button><button class="btn btn-secondary btn-sm">分配</button></div></td>';
    tbody.appendChild(tr);
  });

  // --- Monthly Revenue Bar Chart (mock 6 months data) ---
  var monthlyData = [
    { date: '8月', value: 32500 },
    { date: '9月', value: 38200 },
    { date: '10月', value: 35800 },
    { date: '11月', value: 41200 },
    { date: '12月', value: 46000 },
    { date: '1月', value: 51500 }
  ];
  var maxVal = Math.max.apply(null, monthlyData.map(function(d) { return d.value; }));
  var chart = document.getElementById('revenueChart');
  var labels = document.getElementById('revenueLabels');
  monthlyData.forEach(function(d) {
    var bar = document.createElement('div');
    bar.className = 'chart-bar-item' + (d.value === maxVal ? ' accent' : '');
    bar.style.height = ((d.value / maxVal) * 100) + '%';
    bar.style.position = 'relative';
    bar.classList.add('tooltip');
    bar.setAttribute('data-tip', d.date + ' ¥' + d.value.toLocaleString());
    chart.appendChild(bar);

    var lbl = document.createElement('div');
    lbl.style.flex = '1';
    lbl.style.textAlign = 'center';
    lbl.style.fontSize = '11px';
    lbl.style.color = d.value === maxVal ? 'var(--color-accent)' : 'var(--color-text-muted)';
    lbl.style.fontWeight = d.value === maxVal ? '600' : '400';
    lbl.textContent = d.date;
    labels.appendChild(lbl);
  });

  // --- Platform Breakdown with progress bars ---
  var breakdown = [
    { name: '抖音', value: 18200, percent: 35, color: 'var(--color-primary)' },
    { name: '小红书', value: 12600, percent: 24, color: 'var(--color-accent)' },
    { name: 'B站', value: 8400, percent: 16, color: 'var(--color-success)' },
    { name: '其他', value: 12300, percent: 24, color: 'var(--color-warning)' }
  ];
  var pb = document.getElementById('platformBreakdown');
  breakdown.forEach(function(b) {
    var row = document.createElement('div');
    row.innerHTML = ''
      + '<div class="flex items-center justify-between mb-8">'
      + '  <div class="flex items-center gap-8">'
      + '    <span style="width:10px;height:10px;border-radius:2px;background:' + b.color + ';display:inline-block;"></span>'
      + '    <span class="text-md font-medium">' + b.name + '</span>'
      + '  </div>'
      + '  <div class="flex items-center gap-8">'
      + '    <span class="font-semibold">¥' + b.value.toLocaleString() + '</span>'
      + '    <span class="text-sm text-muted" style="min-width:36px;text-align:right;">' + b.percent + '%</span>'
      + '  </div>'
      + '</div>'
      + '<div class="progress"><div class="progress-bar" style="width:' + b.percent + '%;background:' + b.color + ';"></div></div>';
    pb.appendChild(row);
  });
})();
</script>
</body>
</html>
