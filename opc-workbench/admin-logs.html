<style>
body[data-page="admin-logs"] .nav-item[data-nav="admin-logs"] { background: var(--color-primary-light); color: var(--color-primary); }
body[data-page="admin-logs"] .nav-item[data-nav="admin-logs"]::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: var(--color-primary); border-radius: 0 3px 3px 0; }

/* --- Filter Bar --- */
.filter-bar {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.filter-tabs {
  display: flex; gap: 4px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 4px;
}
.filter-tab {
  padding: 6px 12px;
  font-size: 12px; font-weight: 500;
  color: var(--color-text-sub);
  border-radius: 4px;
  transition: all var(--transition);
  cursor: pointer;
}
.filter-tab:hover { color: var(--color-text); }
.filter-tab.active { background: var(--color-primary); color: #fff; }
.date-btn {
  height: 32px; padding: 0 12px;
  display: flex; align-items: center; gap: 6px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text-sub);
  font-size: 12px;
  transition: all var(--transition);
  cursor: pointer;
}
.date-btn:hover { color: var(--color-text); border-color: var(--color-primary); }
.date-btn svg { width: 14px; height: 14px; }
.date-btn.active { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }
.log-search {
  flex: 1; min-width: 200px;
  position: relative;
}
.log-search input {
  width: 100%; height: 32px;
  padding: 0 12px 0 32px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: var(--color-text);
  font-size: 12px;
  outline: none;
  transition: border-color var(--transition);
}
.log-search input:focus { border-color: var(--color-primary); }
.log-search input::placeholder { color: var(--color-text-muted); }
.log-search svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--color-text-muted);
}
</style>
</head>

<script>
function setTheme(name, el) {
  document.body.setAttribute('data-theme', name);
  try { localStorage.setItem('opc-theme', name); } catch(e) {}
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  if (el) el.classList.add('active');
}
try { var saved = localStorage.getItem('opc-theme'); if (saved && saved !== 'indigo') { setTheme(saved); } } catch(e) {}

(function() {
  var levelLabel = {
    success: 'SUCCESS',
    info: 'INFO',
    warn: 'WARN',
    error: 'ERROR'
  };

  var logList = document.getElementById('logList');
  var countEl = document.getElementById('logCount');
  var currentLevel = 'all';
  var currentSearch = '';

  function render() {
    var filtered = DB.systemLogs.filter(function(l) {
      if (currentLevel !== 'all' && l.level !== currentLevel) return false;
      if (currentSearch && l.msg.toLowerCase().indexOf(currentSearch) === -1) return false;
      return true;
    });
    countEl.textContent = filtered.length;
    logList.innerHTML = '';
    if (filtered.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = ''
        + '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'
        + '<div class="empty-state-text">没有符合条件的日志</div>';
      logList.appendChild(empty);
      return;
    }
    filtered.forEach(function(l) {
      var entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = ''
        + '<span class="log-time">' + l.time + '</span>'
        + '<span class="log-level ' + l.level + '">' + levelLabel[l.level] + '</span>'
        + '<span class="log-msg">' + l.msg + '</span>';
      logList.appendChild(entry);
    });
  }

  // --- Level filter ---
  document.querySelectorAll('#levelFilter .filter-tab').forEach(function(t) {
    t.addEventListener('click', function() {
      document.querySelectorAll('#levelFilter .filter-tab').forEach(function(x) { x.classList.remove('active'); });
      t.classList.add('active');
      currentLevel = t.dataset.level;
      render();
    });
  });

  // --- Search ---
  var searchInput = document.getElementById('logSearchInput');
  searchInput.addEventListener('input', function() {
    currentSearch = searchInput.value.trim().toLowerCase();
    render();
  });

  // --- Date buttons toggle ---
  document.querySelectorAll('.date-btn').forEach(function(b) {
    b.addEventListener('click', function() {
      document.querySelectorAll('.date-btn').forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active');
    });
  });

  render();
})();
</script>
