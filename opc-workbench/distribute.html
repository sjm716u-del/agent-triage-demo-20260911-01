    /* --- Page-specific: distribution --- */
    .pf-badge { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.14); }
    .pf-badge.sm { width: 24px; height: 24px; border-radius: 6px; font-size: 9px; }

    .preview-video { position: relative; aspect-ratio: 9 / 16; max-height: 280px; background: linear-gradient(135deg, #0f172a, #1e293b); border: 1px solid var(--color-border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-video::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(99,102,241,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,.05) 1px, transparent 1px); background-size: 20px 20px; }
    .preview-play { width: 56px; height: 56px; border-radius: 50%; background: rgba(99,102,241,0.92); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-glow); z-index: 1; }
    .preview-play svg { color: #fff; width: 24px; height: 24px; }
    .preview-corner { position: absolute; z-index: 1; }

    .pf-card { position: relative; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px; transition: all var(--transition); cursor: pointer; }
    .pf-card:hover { border-color: var(--color-surface-elevated); }
    .pf-card.selected { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary), var(--shadow-glow); }
    .pf-card.unselected { opacity: 0.45; }
    .pf-check { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); display: flex; align-items: center; justify-content: center; }
    .pf-check svg { width: 12px; height: 12px; color: #fff; }
    .pf-time { width: 100%; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-text); font-size: 12px; padding: 6px 8px; outline: none; margin-top: 12px; transition: border-color var(--transition); }
    .pf-time:focus { border-color: var(--color-primary); }

    .ai-row { padding: 12px 0; border-bottom: 1px solid var(--color-border-light); }
    .ai-row:last-child { border-bottom: none; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .queue-progress { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .queue-progress .progress { flex: 1; }
    .queue-progress span { font-size: 11px; color: var(--color-text-sub); width: 32px; text-align: right; }

    .adapt-note { display: inline-flex; align-items: center; gap: 4px; color: var(--color-warning); font-size: 12px; }
    .adapt-note svg { width: 13px; height: 13px; }
    .adapt-ok { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
    .adapt-ok svg { width: 14px; height: 14px; color: var(--color-success); }
  </style>

<script>
// Theme switcher
function setTheme(name, el) {
  document.body.setAttribute('data-theme', name);
  try { localStorage.setItem('opc-theme', name); } catch(e) {}
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  if (el) el.classList.add('active');
  else {
    var match = document.querySelector('.theme-dot[data-set="' + name + '"]');
    if (match) match.classList.add('active');
  }
}
// Restore saved theme
try {
  var saved = localStorage.getItem('opc-theme');
  if (saved && saved !== 'indigo') {
    setTheme(saved);
  }
} catch(e) {}
</script>

  var ADAPT = [
    { name: '抖音', icon: 'DY', color: '#000', aspect: '9:16', aspectOk: true, dur: '15 分钟', durOk: true, title: '🔥AI正在改变教育！3分钟看懂', tags: 3 },
    { name: '快手', icon: 'KS', color: '#FF4906', aspect: '9:16', aspectOk: true, dur: '15 分钟', durOk: true, title: 'AI正在改变教育！3分钟看懂', tags: 3 },
    { name: '视频号', icon: 'SPH', color: '#07C160', aspect: '9:16', aspectOk: true, dur: '裁剪至 10 分钟', durOk: false, title: 'AI正在改变教育！3分钟看懂', tags: 3 },
    { name: 'B站', icon: 'BZ', color: '#FB7299', aspect: '16:9（自动裁切横屏）', aspectOk: false, dur: '无限制', durOk: true, title: '【硬核科普】AI教育到底是什么？', tags: 3 },
    { name: '小红书', icon: 'XHS', color: '#FF2442', aspect: '图文卡片（自动转图文）', aspectOk: false, dur: '图文', durOk: true, title: 'AI教育太香了！新手必看入门', tags: 4 }
  ];
  var adaptBody = document.querySelector('#adaptTable tbody');
  ADAPT.forEach(function (p) {
    var aspectCell = p.aspectOk
      ? '<span class="adapt-ok">' + p.aspect + ' ' + icon('check') + '</span>'
      : '<span class="adapt-note">' + icon('alert') + p.aspect + '</span>';
    var durCell = p.durOk
      ? '<span class="adapt-ok">' + p.dur + ' ' + icon('check') + '</span>'
      : '<span class="adapt-note">' + icon('alert') + p.dur + '</span>';
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><div class="flex items-center gap-8">' + badge(p) + '<span>' + p.name + '</span></div></td>' +
      '<td>' + aspectCell + '</td>' +
      '<td>' + durCell + '</td>' +
      '<td class="text-sm text-sub" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + p.title + '</td>' +
      '<td><span class="adapt-ok">' + p.tags + ' 个 ' + icon('check') + '</span></td>';
    adaptBody.appendChild(tr);
  });

  // ===== Platform selection (Row 2) =====
  var pfGrid = document.getElementById('pfGrid');
  var pfCount = document.getElementById('pfCount');
  function renderPlatforms() {
    pfGrid.innerHTML = '';
    var selected = 0;
    DB.distPlatforms.forEach(function (p) {
      if (p.selected) selected++;
      var card = document.createElement('div');
      card.className = 'pf-card' + (p.selected ? ' selected' : ' unselected');
      card.innerHTML =
        (p.selected ? '<div class="pf-check">' + icon('check', 12) + '</div>' : '') +
        '<div class="flex items-center gap-12">' +
          '<span class="pf-badge" style="background:' + p.color + '">' + p.icon + '</span>' +
          '<div>' +
            '<div class="font-semibold text-md">' + p.name + '</div>' +
            '<div class="flex items-center gap-8 mt-8">' +
              '<span class="tag tag-neutral">' + p.aspect + '</span>' +
              '<span class="text-sm text-muted">≤' + p.maxDur + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        (p.selected
          ? '<label class="flex items-center gap-8" style="margin-top:12px;"><span class="text-sm text-sub">定时</span><input type="time" class="pf-time" style="margin-top:0;" value="' + (p.schedule || '09:00') + '"></label>'
          : '<div class="text-sm text-muted" style="margin-top:12px;">未选择 · 点击启用</div>');
      var lbl = card.querySelector('label');
      if (lbl) lbl.addEventListener('click', function (e) { e.stopPropagation(); });
      card.addEventListener('click', function () {
        p.selected = !p.selected;
        if (p.selected && !p.schedule) p.schedule = '09:00';
        renderPlatforms();
      });
      pfGrid.appendChild(card);
    });
    pfCount.textContent = '已选 ' + selected + '/8';
  }
  renderPlatforms();

  // ===== AI titles (Row 3 left) =====
  var AI_TITLES = [
    { name: '抖音', icon: 'DY', color: '#000', title: '🔥AI正在改变教育！3分钟看懂未来课堂' },
    { name: 'B站', icon: 'BZ', color: '#FB7299', title: '【硬核科普】AI教育到底是什么？深度解析未来教育趋势' },
    { name: '小红书', icon: 'XHS', color: '#FF2442', title: 'AI教育太香了！新手必看的入门指南📚' },
    { name: '知乎', icon: 'ZH', color: '#0084FF', title: '人工智能如何重塑教育行业？从技术到应用的全面分析' },
    { name: '今日头条', icon: 'TT', color: '#FF0000', title: 'AI教育革命来了！2025年最值得关注的教育趋势' }
  ];
  var aiTitles = document.getElementById('aiTitles');
  AI_TITLES.forEach(function (p) {
    var row = document.createElement('div');
    row.className = 'ai-row';
    row.innerHTML =
      '<div class="flex items-center gap-8 mb-8">' + badge(p) + '<span class="font-medium text-md">' + p.name + '</span></div>' +
      '<div class="text-sm" style="line-height:1.6;">' + p.title + '</div>';
    aiTitles.appendChild(row);
  });

  // ===== AI tags (Row 3 right) =====
  var AI_TAGS = [
    { name: '抖音', icon: 'DY', color: '#000', tags: ['#AI教育', '#未来课堂', '#教育科技'] },
    { name: 'B站', icon: 'BZ', color: '#FB7299', tags: ['#人工智能', '#教育科普', '#科技前沿'] },
    { name: '小红书', icon: 'XHS', color: '#FF2442', tags: ['#AI教育', '#新手指南', '#学习打卡', '#干货分享'] },
    { name: '知乎', icon: 'ZH', color: '#0084FF', tags: ['#人工智能', '#教育', '#行业分析', '#深度好文'] },
    { name: '今日头条', icon: 'TT', color: '#FF0000', tags: ['#AI教育', '#教育趋势', '#科技前沿', '#2025展望'] }
  ];
  var aiTags = document.getElementById('aiTags');
  AI_TAGS.forEach(function (p) {
    var row = document.createElement('div');
    row.className = 'ai-row';
    var tagHtml = p.tags.map(function (t) { return '<span class="tag tag-info">' + t + '</span>'; }).join('');
    row.innerHTML =
      '<div class="flex items-center gap-8">' + badge(p) + '<span class="font-medium text-md">' + p.name + '</span></div>' +
      '<div class="tag-list">' + tagHtml + '</div>';
    aiTags.appendChild(row);
  });

  // ===== Publish queue (Row 4) =====
  var QUEUE = [
    { name: '抖音', icon: 'DY', color: '#000', time: '今日 09:00', title: '🔥AI正在改变教育！3分钟看懂未来课堂', status: '已发布', statusClass: 'tag-success', progress: 100 },
    { name: '快手', icon: 'KS', color: '#FF4906', time: '今日 09:05', title: 'AI正在改变教育！3分钟看懂未来课堂', status: '适配中', statusClass: 'tag-warning', progress: 65 },
    { name: '视频号', icon: 'SPH', color: '#07C160', time: '今日 09:10', title: 'AI正在改变教育！3分钟看懂未来课堂', status: '已发布', statusClass: 'tag-success', progress: 100 },
    { name: 'B站', icon: 'BZ', color: '#FB7299', time: '今日 10:00', title: '【硬核科普】AI教育到底是什么？深度解析', status: '已发布', statusClass: 'tag-success', progress: 100 },
    { name: '小红书', icon: 'XHS', color: '#FF2442', time: '今日 10:30', title: 'AI教育太香了！新手必看的入门指南', status: '排队中', statusClass: 'tag-neutral', progress: 15 },
    { name: '知乎', icon: 'ZH', color: '#0084FF', time: '今日 11:00', title: '人工智能如何重塑教育行业？全面分析', status: '失败', statusClass: 'tag-danger', progress: 0 }
  ];
  var queueBody = document.querySelector('#queueTable tbody');
  QUEUE.forEach(function (q) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><div class="flex items-center gap-8">' + badge(q) + '<span>' + q.name + '</span></div></td>' +
      '<td class="text-sm text-sub">' + q.time + '</td>' +
      '<td class="text-sm" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + q.title + '</td>' +
      '<td><span class="tag ' + q.statusClass + '">' + q.status + '</span></td>' +
      '<td><div class="queue-progress"><div class="progress"><div class="progress-bar" style="width:' + q.progress + '%;"></div></div><span>' + q.progress + '%</span></div></td>';
    queueBody.appendChild(tr);
  });
})();
</script>
