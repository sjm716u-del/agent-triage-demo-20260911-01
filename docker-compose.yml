version: "3.8"

services:
  opc-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: opc-workbench:latest
    container_name: opc-workbench
    restart: unless-stopped
    ports:
      - "${OPC_PORT:-8080}:80"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
