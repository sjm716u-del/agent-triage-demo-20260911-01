# OPC Workbench Nginx 配置
# 用于 Docker 容器及自托管 Nginx 服务器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 字符集
    charset utf-8;

    # HTML 不缓存，确保更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源长缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/json
        image/svg+xml;

    # 多页应用路由（当前为多页，每个 .html 独立存在，无需 SPA fallback）
    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
