<script src="mock.js"></script>
<script src="api.js"></script>
<script>
function setTheme(name, el) {
  document.body.setAttribute('data-theme', name);
  try { localStorage.setItem('opc-theme', name); } catch(e) {}
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  if (el) el.classList.add('active');
}
try { var saved = localStorage.getItem('opc-theme'); if (saved && saved !== 'indigo') { setTheme(saved); } } catch(e) {}

// ===== Page-specific JS =====
(function() {
  const planClass = { free: 'plan-free', pro: 'plan-pro', 'pro-plus': 'plan-pro-plus', team: 'plan-team' };
  const planLabel = { free: 'Free', pro: 'Pro', 'pro-plus': 'Pro+', team: 'Team' };
  const statusClass = { active: 'tag-success', suspended: 'tag-danger', pending: 'tag-warning' };
  const statusLabel = { active: '正常', suspended: '已封禁', pending: '待审核' };

  const tbody = document.querySelector('#userTable tbody');
  DB.adminUsers.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="flex items-center gap-8">
          <div class="avatar avatar-sm">${u.avatar}</div>
          <div>
            <div class="font-medium">${u.name}</div>
            <div class="text-sm text-muted" style="font-size:11px;">${u.email}</div>
          </div>
        </div>
      </td>
      <td><span class="plan-badge ${planClass[u.plan]}">${planLabel[u.plan]}</span></td>
      <td><span class="font-medium">${u.platforms}</span></td>
      <td>${u.workflows}</td>
      <td><span class="tag ${statusClass[u.status]}">${statusLabel[u.status]}</span></td>
      <td class="text-sm text-muted">${u.lastActive}</td>
      <td style="text-align:right;">
        <div class="flex gap-4" style="justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" title="编辑">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            编辑
          </button>
          <button class="btn btn-ghost btn-sm" title="更多">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
})();
</script>
